<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found &middot; Substations &amp; Generators</title>
<link rel="icon" href="assets/koc-logo.png" type="image/png">
<style>
:root { --bg:#070b16; --surface:#101829; --border:rgba(255,255,255,.14);
        --text:#e9eefb; --text-dim:#93a1bf; --accent:#4c7dff; --accent-2:#8b5cf6; }
* { box-sizing:border-box; }
body { margin:0; min-height:100vh; display:grid; place-items:center; padding:28px;
       background:var(--bg); color:var(--text);
       font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif; }
body::before { content:''; position:fixed; inset:0; pointer-events:none;
       background:radial-gradient(760px 420px at 18% -8%, rgba(76,125,255,.20), transparent 62%),
                  radial-gradient(680px 400px at 88% 4%, rgba(139,92,246,.15), transparent 60%); }
.card { position:relative; text-align:center; background:var(--surface);
        border:1px solid var(--border); border-radius:18px; padding:38px 34px;
        box-shadow:0 30px 70px -24px rgba(0,0,0,.9); max-width:430px; }
img { width:60px; margin-bottom:18px; }
h1 { margin:0 0 8px; font-size:20px; }
p { margin:0 0 22px; color:var(--text-dim); font-size:13.5px; line-height:1.6; }
a { display:inline-block; text-decoration:none; color:#fff; font-weight:600; font-size:13px;
    padding:11px 18px; border-radius:10px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    box-shadow:0 10px 22px -12px rgba(76,125,255,.95); }
</style>
</head>
<body>
  <div class="card">
    <img src="assets/koc-logo.png" alt="KOC">
    <h1>That page is not here</h1>
    <p>The address may have changed, or the link that brought you here is out of date.</p>
    <a href="home.html">Go to the home page</a>
  </div>
</body>
</html>
